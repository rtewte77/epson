name: Build programs

# Builds the two ready-to-run programs:
#   photo-pilot-windows.exe  (Windows 10/11)
#   photo-pilot-linux        (Linux Mint 21+ / Ubuntu 22.04+)
# Every push: download them from the run's "Artifacts".
# Tag a version (git tag v0.1.0 && git push --tags): they are attached to a GitHub Release.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: photo-pilot-windows
            file: photo-pilot-windows.exe
          # Oldest supported Ubuntu = widest glibc compatibility (Linux Mint 21 is based on 22.04).
          - os: ubuntu-22.04
            name: photo-pilot-linux
            file: photo-pilot-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - name: Build
        shell: bash
        run: >
          pyinstaller --noconfirm --onefile --console
          --name ${{ matrix.name }} --paths "$PWD"
          packaging/launcher.py
      - name: Smoke test
        shell: bash
        run: ./dist/${{ matrix.file }} --help
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.file }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
